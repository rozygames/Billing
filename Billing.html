<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rozy Games - Billing System Mobile</title>
    <style>
        :root {
            --primary-color: #007bff;
            --dark-color: #1e1e24;
            --light-bg: #f8f9fa;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--light-bg); color: #333; padding: 15px; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .header { text-align: center; margin-bottom: 20px; border-bottom: 2px dashed #ddd; padding-bottom: 15px; }
        .header h1 { font-size: 24px; color: var(--dark-color); }
        .header p { font-size: 12px; color: #666; margin-top: 5px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .service-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .service-row select { flex: 2; }
        .service-row input { flex: 1; text-align: center; }
        .btn { display: block; width: 100%; padding: 12px; background: var(--primary-color); color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; text-align: center; text-decoration: none; }
        .btn-add { background: #28a745; margin-bottom: 15px; font-size: 14px; padding: 8px; }
        .total-box { background: var(--dark-color); color: #fff; padding: 15px; border-radius: 6px; text-align: right; margin-top: 20px; }
        .total-box h2 { font-size: 20px; color: #ffc107; }
        .note-bensin { font-size: 11px; color: #d9534f; font-style: italic; margin-top: 4px; display: block; }
        
        @media print {
            body { background: #fff; padding: 0; }
            .container { box-shadow: none; max-width: 100%; padding: 0; }
            .no-print { display: none; }
            .total-box { background: #eee; color: #000; }
            .total-box h2 { color: #000; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header Bisnis -->
    <div class="header">
        <h1>ROZY GAMES</h1>
        <p>Spesialis Isi Game PS3, PS4 HEN, & PS5 HEN Terlengkap</p>
        <p>Kota Solok, Sumatera Barat</p>
    </div>

    <!-- Info Pelanggan -->
    <div class="form-group">
        <label>Nama Pelanggan</label>
        <input type="text" id="customerName" class="form-control" placeholder="Nama pelanggan...">
    </div>
    <div class="form-group">
        <label>Tanggal</label>
        <input type="date" id="invoiceDate" class="form-control">
    </div>

    <!-- Item / Layanan -->
    <div class="form-group">
        <label>Daftar Layanan / Game</label>
        <div id="servicesContainer">
            <!-- Baris item otomatis bertambah di sini -->
        </div>
        <button type="button" class="btn btn-add no-print" onclick="addServiceRow()">+ Tambah Item</button>
    </div>

    <!-- Uang Bensin / Antar Alamat -->
    <div class="form-group">
        <label>Uang Bensin Antar Alamat (Rp)</label>
        <input type="number" id="extraFee" class="form-control" value="0" oninput="calculateTotal()">
        <span class="note-bensin">*Bantu bensin disesuaikan berdasarkan jarak alamat.</span>
    </div>

    <!-- Ringkasan Total -->
    <div class="total-box">
        <p>Total Pembayaran:</p>
        <h2 id="totalDisplay">Rp 0</h2>
    </div>

    <!-- Tombol Aksi -->
    <button class="btn no-print" onclick="window.print()">Cetak / Simpan PDF</button>
</div>

<script>
    // Set tanggal hari ini secara otomatis
    document.getElementById('invoiceDate').value = new Date().toISOString().substring(0, 10);

    // Data Pilihan Layanan Sesuai Request Resmi Rozy Games
    const serviceOptions = [
        { name: "-- Pilih Layanan --", price: 0 },
        { name: "Bitbox Patch PS3 (Free Update S/d Akhir Musim)", price: 20000 },
        { name: "Gembox Patch PS3 (Free Update S/d Akhir Musim)", price: 20000 },
        { name: "VR Patch PS3 (Free Update S/d Akhir Musim)", price: 20000 },
        { name: "Bitbox Patch PS4 HEN (Free Update S/d Akhir Musim)", price: 50000 },
        { name: "Monster Patch PS4 HEN (Free Update S/d Akhir Musim)", price: 50000 },
        { name: "Game PS3 (Per Game - Selain Bola)", price: 10000 },
        { name: "Game PS4 HEN (Per Game - Selain Bola)", price: 25000 },
        { name: "Paket Hemat Full Game PS3 160GB", price: 100000 },
        { name: "Paket Hemat Full Game PS3 250GB", price: 120000 },
        { name: "Paket Hemat Full Game PS3 320GB", price: 150000 },
        { name: "Paket Hemat Full Game PS3 500GB", price: 200000 },
        { name: "Paket Hemat Full Game PS4 500GB", price: 150000 },
        { name: "Paket Hemat Full Game PS4 1TB", price: 200000 },
        { name: "Paket Hemat Full Game PS4 2TB", price: 300000 },
        { name: "Ganti Pasta PS3", price: 50000 },
        { name: "Ganti Pasta PS4", price: 75000 }
    ];

    // Fungsi untuk menambah baris pesanan baru
    function addServiceRow() {
        const container = document.getElementById('servicesContainer');
        const row = document.createElement('div');
        row.className = 'service-row';

        // Buat Dropdown Layanan
        const select = document.createElement('select');
        select.className = 'form-control';
        select.onchange = function() { calculateTotal(); };
        serviceOptions.forEach(opt => {
            const option = document.createElement('option');
            option.value = opt.price;
            option.text = opt.name;
            select.appendChild(option);
        });

        // Buat Input Jumlah (Qty)
        const qtyInput = document.createElement('input');
        qtyInput.type = 'number';
        qtyInput.className = 'form-control';
        qtyInput.value = 1;
        qtyInput.min = 1;
        qtyInput.placeholder = "Qty";
        qtyInput.oninput = function() { calculateTotal(); };

        row.appendChild(select);
        row.appendChild(qtyInput);
        container.appendChild(row);
    }

    // Fungsi menghitung total biaya keseluruhan
    function calculateTotal() {
        let total = 0;
        const container = document.getElementById('servicesContainer');
        const rows = container.getElementsByClassName('service-row');

        for (let row of rows) {
            const select = row.querySelector('select');
            const qtyInput = row.querySelector('input');
            
            const price = parseFloat(select.value) || 0;
            const qty = parseInt(qtyInput.value) || 0;
            
            total += price * qty;
        }

        // Tambah uang bensin antar alamat
        const extraFee = parseFloat(document.getElementById('extraFee').value) || 0;
        total += extraFee;

        // Tampilkan hasil format rupiah
        document.getElementById('totalDisplay').innerText = "Rp " + total.toLocaleString('id-ID');
    }

    // Inisialisasi baris pertama saat aplikasi dibuka
    addServiceRow();
</script>

</body>
</html>
